<!DOCTYPE html>
<html>
<head>
    <title>My Banking App</title>

    <!-- CSS file link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <h2> Simple Bank</h2>

        <!-- Balance display -->
        <p>Balance: ₹ <span id="bal">1000</span></p>

        <!-- Amount input -->
        <input type="number" id="amt" placeholder="Enter amount">

        <!-- Buttons -->
        <button onclick="addMoney()">Deposit</button>
        <button onclick="takeMoney()">Withdraw</button>

        <!-- Message -->
        <p id="msg"></p>

    </div>

    <!-- JS file link -->
    <script src="script.js"></script>

</body>
</html>
