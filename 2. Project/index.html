<!DOCTYPE html>
<html>
<head>
  <title>Movie Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Movie Collection</h1>

<div class="buttons">
  <button onclick="filterMovies('all')">All</button>
  <button onclick="filterMovies('action')">Action</button>
  <button onclick="filterMovies('comedy')">Comedy</button>
  <button onclick="filterMovies('horror')">Horror</button>
  <button onclick="filterMovies('romantic')">Romantic</button>
</div>

<div class="movies">

  <!-- Action -->
  <div class="card action"><h3>War</h3></div>
  <div class="card action"><h3>Dhoom</h3></div>
  <div class="card action"><h3>Pathaan</h3></div>

  <!-- Comedy -->
  <div class="card comedy"><h3>Golmaal</h3></div>
  <div class="card comedy"><h3>Hera Pheri</h3></div>
  <div class="card comedy"><h3>Housefull</h3></div>

  <!-- Horror -->
  <div class="card horror"><h3>Raaz</h3></div>
  <div class="card horror"><h3>1920</h3></div>
  <div class="card horror"><h3>Bhoot</h3></div>

  <!-- Romantic -->
  <div class="card romantic"><h3>DDLJ</h3></div>
  <div class="card romantic"><h3>Aashiqui 2</h3></div>
  <div class="card romantic"><h3>Veer-Zaara</h3></div>

</div>

<script src="script.js"></script>
</body>
</html>
